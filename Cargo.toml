[package]
name = "city-server"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-cors = "0.7.1"
actix-identity = "0.8.0"
actix-session = { version = "0.10.1", features = ["cookie-session"] }
actix-web = "4.11.0"
actix-ws = "0.3.0"
chrono = { version = "0.4.41", features = ["serde"] }
diesel_migrations = "2.1.0"
diesel = { version = "2.2.12", features = ["chrono", "postgres", "r2d2"] }
dotenvy = "0.15.7"
futures-util = "0.3.31"
rand = "0.9.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
diesel-derive-enum = { version = "2.1.0", features = ["postgres"] }

[dev-dependencies]
mockall = "0.12.0"

[profile.release]
lto = true
codegen-units = 1
